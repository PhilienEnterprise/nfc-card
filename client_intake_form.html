<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Philien Enterprises — Get Your Card</title>
<style>
  :root{
    --ink:#1c2321;
    --paper:#f6f4ef;
    --line:#d8d3c6;
    --accent:#2f5d50;
    --accent-soft:#e4ece9;
    --muted:#6b6459;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    line-height:1.5;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:48px 24px 96px;
  }
  header{
    border-bottom:1px solid var(--line);
    padding-bottom:20px;
    margin-bottom:32px;
  }
  header img{
    width:100%;
    display:block;
    border-radius:6px;
    margin-bottom:24px;
  }
  h1{
    font-size:1.7rem;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.95rem;
  }
  fieldset{border:none;padding:0;margin:0 0 30px;}
  legend{
    font-size:0.78rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--accent);
    font-weight:600;
    letter-spacing:0.02em;
    margin-bottom:14px;
    padding:0;
  }
  .row{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:160px;}
  label{
    display:block;
    font-size:0.82rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--muted);
    margin-bottom:5px;
  }
  input[type=text], input[type=email], input[type=tel], input[type=url], textarea{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.95rem;
    color:var(--ink);
  }
  input:focus, textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
    border-color:var(--accent);
  }
  textarea{resize:vertical;min-height:60px;}
  .actions{display:flex;gap:12px;align-items:center;margin-top:8px;}
  button{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.98rem;
    font-weight:600;
    padding:13px 26px;
    border-radius:3px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  button:hover{background:#25493f;}
  button:disabled{opacity:0.6;cursor:default;}
  .status{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.9rem;
  }
  .confirm{
    display:none;
    text-align:center;
    padding:60px 20px;
  }
  .confirm h2{font-size:1.4rem;margin-bottom:10px;}
  .confirm p{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--muted);
  }
  .required-note{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.78rem;
    color:var(--muted);
    margin-top:4px;
  }
</style>
</head>

    <h1>Get Your Digital Business Card</h1>
    <p>Fill in your details below — our team will follow up to prepare your card.</p>
  </header>

  <form id="form">
    <fieldset>
      <legend>Name</legend>
      <div class="row">
        <div><label>First name *</label><input type="text" id="first" required></div>
        <div><label>Middle name</label><input type="text" id="middle"></div>
        <div><label>Last name *</label><input type="text" id="last" required></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Work</legend>
      <div class="row">
        <div><label>Company</label><input type="text" id="org"></div>
        <div><label>Job title</label><input type="text" id="title"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Phone</legend>
      <div class="row">
        <div><label>Mobile *</label><input type="tel" id="cell" placeholder="+639171234567" required></div>
        <div><label>Work landline</label><input type="tel" id="work_tel"></div>
      </div>
      <div class="row">
        <div><label>WhatsApp</label><input type="tel" id="whatsapp"></div>
        <div><label>Viber</label><input type="tel" id="viber"></div>
        <div><label>Telegram</label><input type="tel" id="telegram"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Email</legend>
      <div class="row">
        <div><label>Work email</label><input type="email" id="work_email"></div>
        <div><label>Personal email</label><input type="email" id="home_email"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Address (work)</legend>
      <div class="row"><div><label>Street</label><input type="text" id="street"></div></div>
      <div class="row">
        <div><label>City</label><input type="text" id="city"></div>
        <div><label>Province</label><input type="text" id="province"></div>
        <div><label>Postal code</label><input type="text" id="postal"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Web & social</legend>
      <div class="row">
        <div><label>Website</label><input type="url" id="url" placeholder="https://"></div>
        <div><label>Work / business URL</label><input type="url" id="work_url" placeholder="https://"></div>
      </div>
      <div class="row">
        <div><label>LinkedIn</label><input type="url" id="linkedin" placeholder="https://"></div>
        <div><label>Facebook</label><input type="url" id="facebook" placeholder="https://"></div>
        <div><label>Instagram</label><input type="url" id="instagram" placeholder="https://"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Anything else?</legend>
      <textarea id="note" placeholder="Optional note or special request"></textarea>
    </fieldset>

    <div class="actions">
      <button type="submit" id="submit-btn">Submit</button>
      <span class="status" id="status"></span>
    </div>
    <div class="required-note">* Required</div>
  </form>

  <div class="confirm" id="confirm">
    <h2>Thank you!</h2>
    <p>Your details have been received. Our team will be in touch shortly.</p>
  </div>
</div>

<script>
// Paste your deployed Apps Script Web App URL here after deployment.
const ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbx13LKGI5Hb3ia-ltXvzd5a_BQ_A9pRYi3jdb6TVsjXrb-xtdbHQu9QbOtILKucBQu-/exec';

document.getElementById('form').addEventListener('submit', function(e){
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('status');

  if(ENDPOINT_URL.includes('PASTE_YOUR_WEB_APP_URL_HERE')){
    status.textContent = 'Form not yet connected — endpoint URL missing.';
    return;
  }

  const fields = ['first','middle','last','org','title','cell','work_tel','whatsapp','viber','telegram',
    'work_email','home_email','street','city','province','postal','url','work_url','linkedin','facebook','instagram','note'];

  const params = new URLSearchParams();
  fields.forEach(id=>{
    params.append(id, document.getElementById(id).value.trim());
  });

  btn.disabled = true;
  status.textContent = 'Submitting...';

  fetch(ENDPOINT_URL, {
    method: 'POST',
    mode: 'no-cors', // Apps Script web apps don't return readable CORS headers; submission still goes through.
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: params.toString()
  }).then(function(){
    document.getElementById('form').style.display = 'none';
    document.getElementById('confirm').style.display = 'block';
  }).catch(function(){
    status.textContent = '';
    btn.disabled = false;
    alert('Something went wrong submitting your details. Please try again or contact us directly.');
  });
});
</script>
</body>
</html>
